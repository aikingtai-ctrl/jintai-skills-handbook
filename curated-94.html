let curDom = "ALL";
const grid = document.getElementById("grid");
const qInput = document.getElementById("q");
const dlg = document.getElementById("dlg");

function render() {
  const kw = qInput.value.trim().toLowerCase();
  const list = ITEMS.filter(it => (curDom === "ALL" || it.dom === curDom) &&
    (!kw || (it.sid + " " + it.wave + " " + it.dom + " " + it.repo + " " + it.desc).toLowerCase().includes(kw)));
  grid.innerHTML = list.map((it, idx) => `
    <article class="card" data-sid="${it.sid}">
      <div class="card-top">
        <span class="sid">$${it.sid}</span>
        <span class="domain-badge">${it.dom}</span>
      </div>
      <p class="desc">${it.desc}</p>
      <div class="meta">
        <span>来源：${it.repo}</span>
        <span>${it.stat} · ${it.wave}</span>
      </div>
    </article>
  `).join("");
}

grid.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  const it = ITEMS.find(x => x.sid === card.dataset.sid);
  if (!it) return;
  document.getElementById("m-sid").textContent = "$" + it.sid;
  document.getElementById("m-badge").textContent = `${it.dom} ｜ 批次：${it.wave}`;
  document.getElementById("m-desc").textContent = it.desc;
  document.getElementById("m-meta").textContent = `仓库：${it.repo}（${it.stat}）｜ 本机路径：~\\.codex\\skills\\${it.sid}`;
  const cmd = `调用 $${it.sid} 技能，按专业规范执行当前任务`;
  document.getElementById("m-cmd").textContent = cmd;
  const copyBtn = document.getElementById("m-copy");
  copyBtn.textContent = "一键复制调用指令";
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(cmd);
    copyBtn.textContent = "✔ 已复制到剪贴板";
  };
  dlg.showModal();
});

document.getElementById("m-close").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

document.getElementById("chips").addEventListener("click", e => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  curDom = btn.dataset.dom;
  render();
});
qInput.addEventListener("input", render);
render();
